[package]
name = "vrt"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "vrt: safe Rust core for real-time TensorRT inference on Jetson (Logger→Runtime→Engine→Session, ModelSession, CUDA helpers)"
readme = "README.md"

[features]
default = []
# In-process ONNX -> engine builder (links libnvonnxparser via tensorrt-rs)
builder = ["tensorrt-rs/builder"]

[dependencies]
# Raw TensorRT FFI, from kornia/tensorrt-rs. It declares `links = "nvinfer"` and cargo
# keys a git source on the exact spec string, so every crate in a graph must name it
# this same way — a second spelling is a second copy and the graph will not resolve.
tensorrt-rs = { git = "https://github.com/kornia/tensorrt-rs", tag = "v0.1.0" }
thiserror = "2.0"
log = "0.4"
half = "2.4"
cudarc = { workspace = true }
kornia-tensor = { workspace = true }
# For `fit`: sizing an arbitrary frame for a model's input grid. Lives here rather than in one model
# crate because every model crate needs the SAME sizing — two copies drifted once and cost a
# downstream map a quarter of its points.
kornia-image = { workspace = true }
kornia-imgproc = { workspace = true }
