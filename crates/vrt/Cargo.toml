[package]
name = "vision-rt"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "vision-rt: computer vision for TensorRT — safe Rust wrapper and real-time pipelines"

[lib]
name = "vrt"

[features]
default = []
# In-process ONNX -> engine builder (links libnvonnxparser via trt-sys)
builder = ["trt-sys/builder"]

[dependencies]
trt-sys = { path = "../trt-sys" }
thiserror = "2.0"
log = "0.4"
half = "2.4"
cudarc = { workspace = true }
