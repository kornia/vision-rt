[package]
name = "trt-rs-yolo"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "YOLO11/v8 detection for trt-rs — CPU letterbox, decode, NMS"

[lib]
name = "trt_yolo"

[dependencies]
trt-rs         = { path = "../trt" }
kornia-image   = "0.1.14"
kornia-imgproc = "0.1.14"
thiserror      = "2.0"
cudarc         = { version = "0.17", features = ["cuda-12060"] }
