[package]
name = "vrt-hub"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "Model weights distribution + on-device TensorRT engine cache for vision-rt"

[lib]
name = "vrt_hub"

[features]
default = []
# Download pinned ONNX weights from Hugging Face Hub
hub = ["dep:hf-hub"]
# Build engines in-process via nvonnxparser instead of the trtexec subprocess
builder = ["vision-rt/builder"]

[dependencies]
vision-rt = { path = "../vrt" }
sha2      = "0.10"
thiserror = "2.0"
cudarc    = { version = "0.17", features = ["cuda-12060"] }
hf-hub = { version = "0.4", optional = true }
