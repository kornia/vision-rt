[package]
name = "trt"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Safe idiomatic Rust wrapper for TensorRT 10.x"

[features]
default = []
builder = []

[dependencies]
trt-sys = { path = "../trt-sys" }
thiserror = "2.0"
log = "0.4"
half = "2.4"
cudarc = { version = "0.17", features = ["cuda-12060"] }

