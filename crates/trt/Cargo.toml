[package]
name = "trt-rs"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "Safe idiomatic Rust wrapper for TensorRT 10.x"

[lib]
name = "trt"

[features]
default = []
# In-process ONNX -> engine builder (links libnvonnxparser via trt-sys)
builder = ["trt-rs-sys/builder"]

[dependencies]
trt-rs-sys = { path = "../trt-sys" }
thiserror = "2.0"
log = "0.4"
half = "2.4"
cudarc = { version = "0.17", features = ["cuda-12060", "nvrtc"] }
