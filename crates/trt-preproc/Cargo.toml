[package]
name = "trt-rs-preproc"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "Zero-copy GPU preprocessing for TensorRT — bilinear letterbox + RGBA→CHW via cudarc nvrtc"

[lib]
name = "trt_preproc"

[build-dependencies]
cc = "1"

[dependencies]
cudarc    = { version = "0.17", features = ["cuda-12060", "nvrtc"] }
trt-rs = { path = "../trt" }
thiserror = "2.0"
