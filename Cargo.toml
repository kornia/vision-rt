[workspace]
resolver = "2"
members = [
    "crates/trt-sys",
    "crates/vrt",
    "crates/vrt-xfeat",
    "crates/vrt-track",
    "crates/vrt-rfdetr",
    "crates/vrt-rfdetr-kpts",
    "crates/vrt-reid",
    "crates/vrt-hub",
    "examples/xfeat_match",
    "examples/xfeat_bench",
    "examples/rfdetr_bench",
    "examples/rfdetr_kpts_check",
]

[workspace.dependencies]
# One cudarc across the workspace, matching kornia-rs's cudarc feature set so cargo
# unifies to a single build (shared CudaStream/CudaSlice types for zero-copy interop).
cudarc = { version = "0.19", default-features = false, features = [
  "cuda-version-from-build-system",
  "driver",
  "nvrtc",
  "std",
  "fallback-dynamic-loading",
  "fallback-latest",
] }
# kornia GPU image/tensor types — `cudarc` feature enables the device backend +
# custom kernels. Git-pinned to a fixed cuda-preprocess rev (reproducible build).
kornia-image   = { git = "https://github.com/kornia/kornia-rs", rev = "cc3224266c2c6794f0cdacc0112f24b51c0fa5aa", features = ["cudarc"] }
kornia-tensor  = { git = "https://github.com/kornia/kornia-rs", rev = "cc3224266c2c6794f0cdacc0112f24b51c0fa5aa", features = ["cudarc"] }
kornia-imgproc = { git = "https://github.com/kornia/kornia-rs", rev = "cc3224266c2c6794f0cdacc0112f24b51c0fa5aa", features = ["cudarc"] }
kornia-io      = { git = "https://github.com/kornia/kornia-rs", rev = "cc3224266c2c6794f0cdacc0112f24b51c0fa5aa" }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/edgarriba/vision-rt"
authors = ["Edgar Riba <edgar.riba@gmail.com>"]
