[workspace]
resolver = "2"
members = [
    "crates/vrt-sys",
    "crates/vrt",
    "crates/vrt-preproc",
    "crates/vrt-xfeat",
    "crates/vrt-yolo",
    "crates/vrt-gst",
    "crates/nvbuf-sys",
    "crates/vrt-hub",
    "examples/rtsp_yolo",
    "examples/rtsp_xfeat",
    "examples/xfeat_match",
    "examples/xfeat_bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/edgarriba/vision-rt"
authors = ["Edgar Riba <edgar.riba@gmail.com>"]
