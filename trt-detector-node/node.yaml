name: trt-detector
version: 0.1.0
type: rust
description: "YOLO TensorRT inference processor: subscribes to camera RGBA frames, publishes bounding-box detections"
author: Edgar Riba <edgar.riba@gmail.com>

build: cargo build --release -p trt-detector-node
command: ./target/release/trt-detector-node

capabilities:
  - processor

requires:
  hardware:
    - gpu
    - tensorrt

inputs:
  - name: raw
    topic_suffix: "raw"
    encoding: "application/cbor"

outputs:
  - name: detections
    topic_suffix: "detections"
    encoding: "application/cbor"

config_schema:
  name: string
  camera: string
  engine_path: string
  model_size: integer
  conf_threshold: number
  iou_threshold: number
