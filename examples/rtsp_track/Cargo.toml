# Standalone example: RTSP → RF-DETR-Seg + Depth Anything V2 + BoT-SORT tracking,
# device end-to-end. The mask-sampled metric depth feeds each detection's `pz`, so
# the 3D Kalman tracks metric depth + approach velocity (not just an image-plane box).
# Kept OUT of the vision-rt workspace (private `sensor-rtsp` git dep + GStreamer).
[package]
name = "rtsp_track"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "rtsp_track"
path = "src/main.rs"

[dependencies]
vrt-depth-anything = { path = "../../crates/vrt-depth-anything" }
vrt-rfdetr-seg = { path = "../../crates/vrt-rfdetr-seg" }
vrt-track = { path = "../../crates/vrt-track", features = ["appearance"] }
vrt-osnet = { path = "../../crates/vrt-osnet" }
vrt-types = { path = "../../crates/vrt-types" }
# CPU rendering + MJPEG/GIF/PNG viz. `turbojpeg` = SIMD JPEG for the live stream.
vrt-viz = { path = "../../crates/vrt-viz", features = ["h264"] }
# Private git dep (kornia/sensor-rt) — needs CARGO_NET_GIT_FETCH_WITH_CLI=true.
sensor-rtsp = { git = "https://github.com/kornia/sensor-rt", rev = "11737f555a3679f8e50d31fc6468f29e33f9dab2" }
kornia-image = { git = "https://github.com/kornia/kornia-rs", branch = "main", features = ["cuda"] }
cudarc = { version = "0.19", default-features = false, features = [
  "cuda-version-from-build-system",
  "driver",
  "nvrtc",
  "std",
  "fallback-dynamic-loading",
  "fallback-latest",
] }
env_logger = "0.11"
log = "0.4"

# Build this example against the LOCAL vision-rt, not upstream's pinned snapshot.
#
# `sensor-rtsp`'s dev-dependencies reference kornia/vision-rt at a fixed rev. Without this
# patch cargo would happily resolve both that snapshot and the local path crates, and the
# example would exercise whichever it picked — silently testing upstream's `vrt` rather
# than the working tree you are editing. Redirect the git source so the whole graph is one
# copy: the local one.
#
# (This also used to be load-bearing for a different reason — `vrt` was a normal dependency
# of the sensor-rtsp *library*, so its `trt-sys` and ours both declared `links = "nvinfer"`
# and cargo refused to resolve at all. kornia/sensor-rt#9 moved `vrt` to dev-dependencies,
# so that collision is gone; the reason above is why the patch stays.)
[patch."https://github.com/kornia/vision-rt"]
trt-sys    = { path = "../../crates/trt-sys" }
vrt        = { path = "../../crates/vrt" }
vrt-types  = { path = "../../crates/vrt-types" }
