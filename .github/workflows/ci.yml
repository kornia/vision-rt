name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting gate: pure parse, no TensorRT/CUDA needed.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Hosted x86 runner: no TensorRT/CUDA — trt-sys runs in stub mode
  # (TRT_STUB=1: committed pregenerated bindings, no native compile/link).
  check:
    runs-on: ubuntu-latest
    env:
      TRT_STUB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (stub)
        run: cargo check -p trt-sys -p vrt -p vrt-hub -p vrt-xfeat -p vrt-raco-aliked -p vrt-lightglue -p vrt-rfdetr -p vrt-rfdetr-kpts -p vrt-dinov3 -p vrt-depth-anything
      - name: cargo clippy (stub)
        run: cargo clippy --all-targets -p trt-sys -p vrt -p vrt-hub -p vrt-xfeat -p vrt-raco-aliked -p vrt-lightglue -p vrt-rfdetr -p vrt-rfdetr-kpts -p vrt-dinov3 -p vrt-depth-anything -- -D warnings
      # The GPU-free tests, on the hosted runner. Everything the benchmark harness and
      # the match guards assert is arithmetic — no CUDA, no TensorRT — so gating it behind
      # the (currently disabled) Jetson job meant a width-guard or resize-scale regression
      # shipped green. That is how the first broken width check reached main.
      - name: cargo test (stub, no GPU)
        run: cargo test -p vrt-xfeat --lib
      - name: cargo test (benchmark harness)
        run: cargo test -p vrt-lightglue --tests --examples
      # The out-of-process bridge tools' file formats. Their consumers are in another
      # workspace and cannot be compiled here, so the on-disk layout is the only place
      # the contract is checked at all — and every one of these is pure byte arithmetic.
      - name: cargo test (batch bridge tools)
        run: cargo test -p vrt-dinov3 -p vrt-depth-anything --examples

      - name: cargo clippy (builder + hub features)
        run: cargo clippy -p vrt -p vrt-hub -p vrt-xfeat -p vrt-raco-aliked -p vrt-lightglue --features vrt-xfeat/builder,vrt-xfeat/hub,vrt-raco-aliked/builder,vrt-raco-aliked/hub,vrt-lightglue/builder,vrt-lightglue/hub -- -D warnings

  # Self-hosted Jetson runner: real TensorRT + CUDA.
  # Register a runner on the Orin with labels [self-hosted, jetson], then
  # remove the `if: false` guard.
  jetson:
    if: false  # enable once a self-hosted Jetson runner is registered
    runs-on: [self-hosted, jetson]
    steps:
      - uses: actions/checkout@v4
      - name: Build workspace (release)
        run: cargo build --release -j2
      # Two steps on purpose: a target selector (`--lib`/`--examples`) suppresses
      # doctests, and vrt-hub's compile-checked API example lives in one.
      - name: CPU unit tests
        run: cargo test -p vrt-hub -p vrt-raco-aliked -p vrt-lightglue
      - name: CPU unit tests (vrt-xfeat + harness)
        run: cargo test -p vrt-xfeat --lib && cargo test -p vrt-lightglue --tests --examples
      - name: GPU tests (kernels vs CPU reference)
        run: cargo test -p vrt-xfeat --release -- --ignored
