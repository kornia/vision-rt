name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting gate: pure parse, no TensorRT/CUDA needed.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Hosted x86 runner: no TensorRT/CUDA — trt-sys and vrt-preproc run in stub
  # mode (TRT_STUB=1: committed pregenerated bindings, no native compile/link).
  # Jetson-only crates (vrt-gst, nvbuf-sys) are excluded.
  check:
    runs-on: ubuntu-latest
    env:
      TRT_STUB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (stub)
        run: >
          cargo check
          -p trt-sys -p vision-rt
          -p vrt-xfeat -p vrt-track -p vrt-rfdetr -p vrt-rfdetr-kpts -p vrt-hub
      - name: cargo clippy (stub)
        run: >
          cargo clippy
          -p trt-sys -p vision-rt
          -p vrt-xfeat -p vrt-track -p vrt-rfdetr -p vrt-rfdetr-kpts -p vrt-hub
          -- -D warnings
      - name: cargo clippy (builder feature)
        run: cargo clippy -p vision-rt -p vrt-hub --features vrt-hub/builder -- -D warnings

  # Self-hosted Jetson runner: real TensorRT + CUDA.
  # Register a runner on the Orin with labels [self-hosted, jetson], then
  # remove the `if: false` guard.
  jetson:
    if: false  # enable once a self-hosted Jetson runner is registered
    runs-on: [self-hosted, jetson]
    steps:
      - uses: actions/checkout@v4
      - name: Build workspace (release)
        run: cargo build --release
      - name: CPU unit tests
        run: cargo test -p vrt-hub -p vrt-track
      - name: GPU tests (kernels vs CPU reference)
        run: cargo test -p vrt-xfeat --release -- --ignored
